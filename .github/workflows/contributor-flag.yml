name: Update Contributor Flag

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Create output directory
        run: mkdir -p .github/assets

      - uses: JoyinJoester/North-Korea-Flag@main
        with:
          count: '3'
          output: '.github/assets/contributor-flag.svg'
