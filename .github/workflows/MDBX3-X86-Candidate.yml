name: MDBX3 x86_64 Candidate Export

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/MDBX3-X86-Candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBX_COMMIT: 5cf8af697727095654884e0a76bec6ca12d0ce6b
  RUST_VERSION: 1.86.0
  CARGO_NDK_VERSION: 4.1.2
  NDK_VERSION: 28.2.13676358

jobs:
  export-x86-candidate:
    name: Build, verify, and export x86_64 MDBX3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned MDBX3 source
        uses: actions/checkout@v4
        with:
          repository: Monica-Pass/Mdbx
          ref: ${{ env.MDBX_COMMIT }}
          path: mdbx

      - name: Install pinned Rust and Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add x86_64-linux-android

          ndk_path="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$ndk_path" ]; then
            sdkmanager_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$sdkmanager_path"
            yes | "$sdkmanager_path" "ndk;$NDK_VERSION" >/dev/null
          fi
          test -d "$ndk_path"
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build and verify MDBX3 x86_64 candidate
        working-directory: mdbx
        shell: bash
        run: |
          set -euo pipefail
          cargo ndk \
            -t x86_64 \
            -P 21 \
            -o "$GITHUB_WORKSPACE/mdbx3-jniLibs" \
            build -p mdbx-ffi --profile mdbx3-release

          candidate="$GITHUB_WORKSPACE/mdbx3-jniLibs/x86_64/libmdbx_ffi.so"
          test -f "$candidate"
          llvm_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$llvm_bin/llvm-strip" --strip-all "$candidate"
          python3 scripts/verify-mdbx3-ffi-abi.py verify-exports \
            --baseline crates/mdbx-ffi/abi/mdbx2-uniffi-bindings-v1.json \
            --nm "$llvm_bin/llvm-nm" \
            --library "x86_64=$candidate" \
            --output "$GITHUB_WORKSPACE/mdbx3-x86_64-abi-report.json"
          sha256sum "$candidate" | tee "$GITHUB_WORKSPACE/mdbx3-x86_64.sha256"

      - name: Upload verified MDBX3 x86_64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: mdbx3-x86_64-candidate
          path: |
            mdbx3-jniLibs/x86_64/libmdbx_ffi.so
            mdbx3-x86_64-abi-report.json
            mdbx3-x86_64.sha256
          if-no-files-found: error
          retention-days: 7
