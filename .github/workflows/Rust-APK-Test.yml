name: Rust APK Test

on:
  push:
    branches:
      - test/rust-apk-arm64
    paths:
      - "Monica for Android/rust-core/**"
      - "Monica for Android/rust-jni/**"
      - "Monica for Android/app/**"
      - ".github/workflows/Rust-APK-Test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-test-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Monica for Android"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}"

      - name: Build Rust JNI library for arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs
          pushd rust-jni
          cargo ndk \
            -t arm64-v8a \
            -o ../app/src/main/jniLibs \
            build \
            --release
          popd
          test -f app/src/main/jniLibs/arm64-v8a/libmonica_rust_jni.so
          file app/src/main/jniLibs/arm64-v8a/libmonica_rust_jni.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libmonica_rust_jni.so

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace -PpreviewVersionSuffix=rust-test

      - name: Verify arm64 APK contains Rust JNI library
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -iname '*arm64-v8a*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No arm64-v8a debug APK found"
            find app/build/outputs/apk/debug -maxdepth 1 -type f -print || true
            exit 1
          fi
          unzip -l "$apk" | grep 'lib/arm64-v8a/libmonica_rust_jni.so'
          cp "$apk" app/build/outputs/apk/debug/Monica-rust-arm64-test.apk
          sha256sum app/build/outputs/apk/debug/Monica-rust-arm64-test.apk \
            > app/build/outputs/apk/debug/Monica-rust-arm64-test.apk.sha256

      - name: Upload arm64 Rust test APK
        uses: actions/upload-artifact@v7
        with:
          name: Monica-rust-arm64-test
          path: |
            Monica for Android/app/build/outputs/apk/debug/Monica-rust-arm64-test.apk
            Monica for Android/app/build/outputs/apk/debug/Monica-rust-arm64-test.apk.sha256
          retention-days: 14
          if-no-files-found: error
