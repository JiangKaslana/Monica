name: Update Afdian sponsors

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize documentation repository
        id: docs_repo
        shell: bash
        env:
          CONFIGURED_DOCS_REPOSITORY: ${{ vars.DOCS_REPOSITORY }}
        run: |
          repository="$(node -e 'const value=(process.env.CONFIGURED_DOCS_REPOSITORY || "").trim(); process.stdout.write(value.replace(/[\u2010-\u2015\u2212]/g, "-"));')"
          if [[ -z "$repository" || ! "$repository" =~ ^[^/]+/[^/]+$ ]]; then
            echo "::error title=Invalid DOCS_REPOSITORY::Set DOCS_REPOSITORY to owner/repo, for example Monica-Pass/MonicaDocs."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.docs_repo.outputs.repository }}
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update sponsor acknowledgements
        env:
          AFDIAN_TOKEN: ${{ secrets.AFDIAN_TOKEN }}
          AFDIAN_USER_ID: 8b131882c4ec11f0b26e52540025c377
        run: python .github/scripts/update_afdian_sponsors.py --readme README.md --readme docs-repo/personal.md
      - name: Commit sponsor acknowledgements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "docs: update Afdian sponsor list"
            git push
          fi

          git -C docs-repo config user.name "github-actions[bot]"
          git -C docs-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git -C docs-repo diff --quiet -- personal.md; then
            git -C docs-repo add personal.md
            git -C docs-repo commit -m "docs: update Afdian sponsor list"
            git -C docs-repo push
          fi
