name: Send Release APK to Telegram

on:
  # 手动触发（支持直接输入版本号）
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag，例如 V1.0.305'
        required: false
        type: string
      topic_id:
        description: 'Telegram 话题(Topic) ID，留空使用仓库默认配置'
        required: false
        type: string

  # 兼容直接发布和草稿转正式发布；预览版由 job 条件排除。
  release:
    types: [published, released]

permissions:
  contents: read

concurrency:
  group: telegram-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  send:
    name: Send existing arm64 APK
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.release.draft == false && github.event.release.prerelease == false)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download arm64 APK from GitHub Release
        id: release_apk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            echo "::error title=Release tag missing::Please provide release_tag or trigger via release event."
            exit 1
          fi

          # Release 事件可能先于 Android 构建上传资源到达。最多等待 5 分钟，
          # 并按上传时间选择最新的 arm64 APK，避免误发同一 Release 中的旧包。
          asset_name=""
          for attempt in $(seq 1 30); do
            asset_name="$(
              gh release view "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '[.assets[] | select(.name | test("arm64.*\\.apk$"; "i"))] | sort_by(.createdAt) | last | .name // empty'
            )"
            if [ -n "$asset_name" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error title=arm64 APK missing::Release $tag still has no arm64 APK after waiting 5 minutes."
              exit 1
            fi
            echo "arm64 APK is not available yet (attempt $attempt/30); retrying in 10 seconds..."
            sleep 10
          done

          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" \
            --dir release-assets

          apk_path="release-assets/$asset_name"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "url_tag=$(printf '%s' "$tag" | jq -Rr '@uri')" >> "$GITHUB_OUTPUT"

      - name: Build caption with release notes
        id: build_caption
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_apk.outputs.tag }}
          URL_TAG: ${{ steps.release_apk.outputs.url_tag }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' > release-notes.md

          python3 - "$RELEASE_TAG" "$URL_TAG" <<'PY'
          import html, os, re, sys
          tag, url_tag = sys.argv[1], sys.argv[2]
          repo = os.environ['GITHUB_REPOSITORY']
          body = open('release-notes.md', encoding='utf-8').read().strip()

          def convert(text):
              t = html.escape(text, quote=False)
              t = re.sub(r'```[^\n]*\n(.*?)```', lambda m: '<pre>' + m.group(1) + '</pre>', t, flags=re.S)
              t = re.sub(r'`([^`\n]+)`', r'<code>\1</code>', t)
              t = re.sub(r'\[([^\]\n]+)\]\((https?://[^)\s]+)\)', r'<a href="\2">\1</a>', t)
              t = re.sub(r'^#{1,6}\s*(.+)$', r'<b>\1</b>', t, flags=re.M)
              t = re.sub(r'\*\*([^*\n]+)\*\*', r'<b>\1</b>', t)
              t = re.sub(r'^\s*[-*]\s+', '• ', t, flags=re.M)
              return t

          header = (
              f'🚀 新版本 {tag} 已发布！\n'
              '架构：arm64\n'
              f'仓库：{repo}\n'
              f'下载页面：https://github.com/{repo}/releases/tag/{url_tag}'
          )

          def build(lines, truncated):
              notes = convert('\n'.join(lines))
              if truncated:
                  notes += '\n\n…（日志过长已截断，完整内容见下载页面）'
              return header + '\n\n📦 <b>更新日志</b>\n<blockquote expandable>' + notes + '</blockquote>'

          def fits(caption):
              visible = re.sub(r'<[^>]+>', '', caption)
              return len(visible.encode('utf-16-le')) // 2 <= 1024

          if not body:
              caption = header
          else:
              src = body.splitlines()
              caption = build(src, False)
              if not fits(caption):
                  lines = src[:]
                  while lines and not fits(build(lines, True)):
                      lines.pop()
                  caption = build(lines, True) if lines else header

          with open('caption.html', 'w', encoding='utf-8') as f:
              f.write(caption)
          visible = re.sub(r'<[^>]+>', '', caption)
          print(f'Caption length: {len(visible.encode("utf-16-le")) // 2}/1024')
          PY

      - name: Send APK to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ inputs.topic_id || secrets.TELEGRAM_TOPIC_ID }}
          APK_PATH: ${{ steps.release_apk.outputs.path }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error title=Telegram secrets missing::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is empty."
            exit 1
          fi

          caption="$(cat caption.html)"

          thread_args=()
          if [ -n "${TOPIC_ID:-}" ]; then
            thread_args=(--form-string "message_thread_id=${TOPIC_ID}")
          fi

          curl --fail-with-body --show-error --silent \
            --retry 3 \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=${caption}" \
            --form-string "parse_mode=HTML" \
            "${thread_args[@]}" \
            --form "document=@${APK_PATH}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
