name: Send Release APK to Telegram

run-name: Send ${{ inputs.release_tag }} arm64 APK to Telegram

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag or title, for example V1.0.304
        required: true
        type: string
      topic_id:
        description: Optional Telegram forum topic id; falls back to the TELEGRAM_TOPIC_ID secret, then the General topic
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  send:
    name: Send existing arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64 APK from GitHub Release
        id: release_apk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$(printf '%s' "$RELEASE_TAG" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$tag" ]; then
            echo "::error title=Release tag missing::Please enter a GitHub Release tag or title, for example V1.0.304."
            exit 1
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Retry the lookup by exact release title in case the input was
            # the visible release name rather than its git tag.
            title_json="$(printf '%s' "$tag" | jq -Rr '@json')"
            title_tag="$(
              gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                --json name,tagName \
                --jq ".[] | select(.name == ${title_json}) | .tagName" \
              | head -n 1
            )" || true
            if [ -z "${title_tag:-}" ]; then
              echo "::error title=Release not found::GitHub Release $tag does not exist."
              exit 1
            fi
            echo "Input matched a release title; using tag '$title_tag'."
            tag="$title_tag"
          fi

          shopt -s nocasematch
          arm64_assets=()
          while IFS= read -r asset_name; do
            if [[ "$asset_name" =~ arm64.*\.apk$ ]]; then
              arm64_assets+=("$asset_name")
            fi
          done < <(
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          shopt -u nocasematch

          if [ "${#arm64_assets[@]}" -eq 0 ]; then
            echo "::error title=arm64 APK missing::Release $tag has no arm64 APK asset. Run Android Release Build first or upload the APK to this Release."
            echo "Available assets:"
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' || true
            exit 1
          fi

          if [ "${#arm64_assets[@]}" -gt 1 ]; then
            echo "Multiple arm64 APK assets found; the first one will be sent:"
            printf '  %s\n' "${arm64_assets[@]}"
          fi

          asset_name="${arm64_assets[0]}"
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" \
            --dir release-assets

          apk_path="release-assets/$asset_name"
          if [ ! -f "$apk_path" ]; then
            echo "::error title=APK download failed::Downloaded asset was not found at $apk_path."
            exit 1
          fi

          # Percent-encode the tag for the release URL in the caption.
          encoded_tag="$(printf '%s' "$tag" | jq -Rr '@uri')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "url_tag=$encoded_tag" >> "$GITHUB_OUTPUT"
          echo "Selected asset: $asset_name"

      - name: Send APK to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ inputs.topic_id || secrets.TELEGRAM_TOPIC_ID }}
          RELEASE_TAG: ${{ steps.release_apk.outputs.tag }}
          URL_TAG: ${{ steps.release_apk.outputs.url_tag }}
          APK_PATH: ${{ steps.release_apk.outputs.path }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error title=Telegram secrets missing::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is empty."
            exit 1
          fi

          caption="🚀 新版本 ${RELEASE_TAG} 已发布！
          架构：arm64
          仓库：${GITHUB_REPOSITORY}
          下载页面：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${URL_TAG}"

          # Forum topics require message_thread_id; when unset Telegram posts to the General topic.
          thread_args=()
          if [ -n "${TOPIC_ID:-}" ]; then
            if ! [[ "$TOPIC_ID" =~ ^-?[0-9]+$ ]]; then
              echo "::error title=Invalid topic id::Topic id must be a number, for example 12."
              exit 1
            fi
            thread_args=(--form-string "message_thread_id=${TOPIC_ID}")
            echo "Sending to topic ${TOPIC_ID}."
          fi

          curl --fail-with-body --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=${caption}" \
            "${thread_args[@]}" \
            --form "document=@${APK_PATH}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
