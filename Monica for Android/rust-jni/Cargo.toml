[package]
name = "monica-rust-jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
publish = false
license = "GPL-3.0-only"
description = "Android JNI smoke bridge for Monica Rust password-list core"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
monica-password-list-core = { path = "../rust-core" }
